<!DOCTYPE html>
<html>
<head><title>RedNet Chat</title>
<style>
body{background:#000;color:#0f0;font-family:Arial;padding:20px}
#chat{border:2px solid #0f0;height:400px;overflow:auto;padding:10px}
input{width:70%;padding:10px} button{padding:10px;background:#0f0}
</style>
</head>
<body>
<h1>🔥 RedNet-Brain LIVE 24/7 🔥</h1>
<div id="chat"></div><br>
<input id="msg" placeholder="Ask RedNet...">
<button onclick="send()">Send</button>
<script>
async function send(){
 let m=document.getElementById('msg').value;
 let c=document.getElementById('chat');
 c.innerHTML+=`<p>You: ${m}</p>`;
 let r=await fetch('https://rednet-brain-1.onrender.com/chat',{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message:m})});
 let d=await r.json();
 c.innerHTML+=`<p>RedNet: ${d.reply}</p>`;
 document.getElementById('msg').value='';
}
</script>
</body>
</html>
